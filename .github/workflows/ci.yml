name: rust and benchmark checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: rjs-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: provide ffmpeg for media tests
        timeout-minutes: 2
        run: |
          if command -v ffmpeg >/dev/null; then
            ffmpeg -version
          else
            python3 -m venv "$RUNNER_TEMP/rjs-media-tools"
            "$RUNNER_TEMP/rjs-media-tools/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --retries 1 --timeout 20 imageio-ffmpeg==0.6.0
            mkdir -p "$RUNNER_TEMP/rjs-media-bin"
            rjs_ffmpeg_path=$("$RUNNER_TEMP/rjs-media-tools/bin/python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            ln -s "$rjs_ffmpeg_path" "$RUNNER_TEMP/rjs-media-bin/ffmpeg"
            echo "$RUNNER_TEMP/rjs-media-bin" >> "$GITHUB_PATH"
            "$rjs_ffmpeg_path" -version
          fi
      - run: cargo fmt --all --check
      - name: compile rust tests
        timeout-minutes: 8
        run: cargo test --workspace --locked --no-run
      - name: run rust tests with a deadline
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=15s 2m cargo test --workspace --locked -- --nocapture --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s benchmarks -v
