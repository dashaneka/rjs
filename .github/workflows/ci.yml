name: rust and benchmark checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: rjs-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all --check
      - name: compile rust tests
        timeout-minutes: 8
        run: cargo test --workspace --locked --no-run
      - name: run rust tests with a deadline
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=15s 2m cargo test --workspace --locked -- --nocapture --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s benchmarks -v
