name: rust and benchmark checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: rjs-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install media tools
        timeout-minutes: 3
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            ffmpeg -version
          else
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg
          fi
      - run: cargo fmt --all --check
      - name: compile rust tests
        timeout-minutes: 8
        run: cargo test --workspace --locked --no-run
      - name: run rust tests with a deadline
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=15s 2m cargo test --workspace --locked -- --nocapture --test-threads=1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python3 -m unittest discover -s benchmarks -v
