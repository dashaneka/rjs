[package]
name = "rjs-core"
description = "Video extractors and downloader for TikTok, Instagram, Facebook and X"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.9.3"
base64 = "0.23"
cbc = "0.2.1"
futures-util = "0.3.34"
pbkdf2 = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "json", "stream", "gzip", "brotli", "http2", "charset", "form", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "fs", "io-util", "process", "time"] }
